[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-screener"
version = "0.1.0"
description = "Screener de momentum + calidad con alertas por Telegram"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["screener", "screener.data", "screener.metrics"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
